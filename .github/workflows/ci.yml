name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # sqlx macros compile offline from the committed .sqlx cache
  SQLX_OFFLINE: "true"

jobs:
  ci:
    name: fmt + sqlx + deny + test + clippy + doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-make,cargo-deny,cargo-nextest

      - uses: Swatinem/rust-cache@v2

      # Fails if SQL changed without regenerating .sqlx/
      - run: cargo make sqlx-check

      - run: cargo make fmt

      - run: cargo make deny

      - run: cargo make test

      - run: cargo make clippy

      - run: cargo make doc
