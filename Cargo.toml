[package]
name = "accumulators"
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-only"
description = "Complete package of multiple Accumulators with Stores and hashing functions (Hashers)"
homepage = "https://herodotus.dev/"
repository = "https://github.com/HerodotusDev/rust-accumulators"
documentation = "https://github.com/HerodotusDev/rust-accumulators/blob/main/README.md"
readme = "README.md"
keywords = ["accumulators", "mmr", "merkle", "tree", "incremental"]
categories = ["cryptography", "data-structures", "database"]
exclude = [".github", "Makefile.toml"]

[dependencies]
thiserror = { version = "2", default-features = false } # Error handling (no_std-compatible)
async-trait = { version = "0.1.92", optional = true } # Async traits (v0.5 store layer only)
hex = { version = "0.4.3", optional = true } # Hex encoding/decoding (v0.5 only, std-bound)
tiny-keccak = { version = "2.0.2", features = [
    "keccak",
], optional = true } # Keccak hashing
starknet-crypto = { version = "0.8.1", optional = true } # Starknet Pedersen/Poseidon hashing
starknet-types-core = { version = "0.2", default-features = false, features = [
    "std",
], optional = true } # Felt parsing errors (v0.5 only)
parking_lot = { version = "0.13.0", optional = true } # Synchronous locks (v0.5 memory store)
num-bigint = { version = "0.5.1", optional = true } # Big integers in hashers (v0.5 only)
num-traits = { version = "0.2.19", optional = true } # Numeric traits for bigints (v0.5 only)
indexmap = { version = "2.14.2", optional = true } # Insertion-ordered hash maps (v0.5 merkle tree)
blake2 = { version = "0.11.0", default-features = false, optional = true } # Blake2 hashing
serde_json = { version = "1", optional = true } # JSON encoding for SQLite batch queries
ulid = { version = "3", optional = true } # ULID generation for MmrId

[target.'cfg(not(target_family = "wasm"))'.dependencies]
uuid = { version = "1.29.2", features = [
    "v4",
] } # UUID generation (native); optional at the 1.0.0-rc.1 swap
sqlx = { version = "0.9", optional = true, default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "macros",
] } # SQLite store backend (native)

[target.'cfg(target_family = "wasm")'.dependencies]
# remember to use: export RUSTFLAGS='--cfg getrandom_backend="wasm_js"'
getrandom = { version = "0.4.3", features = [
    "wasm_js",
] } # Randomness source for UUID v4 (WASM)
uuid = { version = "1.29.2", features = ["v4", "js"] } # UUID generation (WASM)

[dev-dependencies]
accumulators = { path = ".", features = [
    "all",
] } # Self-dependency: all features for tests/benches
criterion = { version = "0.8.2", features = [
    "html_reports",
] } # Benchmarking framework

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
] } # Async runtime for tests/benches

[target.'cfg(target_family = "wasm")'.dev-dependencies]
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
] } # Async runtime for tests (WASM)

[[bench]]
name = "mmr_benchmark"
harness = false

[[bench]]
name = "incremental_benchmark"
harness = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[features]
default = ["store", "hasher"]
all = [
    "store",
    "sqlite",
    "memory",
    "hasher",
    "keccak",
    "poseidon",
    "pedersen",
    "blake",
    "mmr",
    "stacked_mmr",
    "draft_mmr",
    "merkle_tree",
    "incremental_merkle_tree",
    "uuid_v7",
    "ulid",
]
store = ["dep:async-trait"]
sqlite = [
    "store",
    "dep:sqlx",
    "sqlx/sqlite",
    "sqlx/runtime-tokio",
    "dep:serde_json",
]
memory = ["store", "dep:parking_lot"]
hasher = []
keccak = ["hasher", "dep:tiny-keccak"]
poseidon = [
    "hasher",
    "dep:starknet-crypto",
    "dep:starknet-types-core",
    "dep:num-bigint",
    "dep:num-traits",
]
pedersen = [
    "hasher",
    "dep:starknet-crypto",
    "dep:starknet-types-core",
    "dep:num-bigint",
    "dep:num-traits",
]
blake = ["hasher", "dep:blake2", "dep:num-bigint", "dep:num-traits"]
mmr = ["hasher", "store"]
stacked_mmr = ["mmr"]
draft_mmr = ["stacked_mmr"]
merkle_tree = ["hasher", "store", "dep:indexmap", "dep:hex"]
incremental_merkle_tree = ["merkle_tree"]
# Design-draft id features: uuid is currently a hard dep (v4 always on);
# splitting it into optional `uuid_v4` / `uuid_v7` is part of the 1.0.0-rc.1 work.
uuid_v7 = ["uuid/v7"]
ulid = ["dep:ulid"]
