[config]
default_to_workspace = false

[tasks.test]
description = "Run the full test suite"
command = "cargo"
args = ["nextest", "run"]

[tasks.fmt]
description = "Check formatting"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.fmt-fix]
description = "Apply formatting"
command = "cargo"
args = ["fmt", "--all"]

[tasks.bench]
description = "Run the criterion benchmarks"
command = "cargo"
args = ["bench"]

[tasks.package]
description = "Dry-run the crates.io package (verifies exclude)"
command = "cargo"
args = ["package", "--allow-dirty", "--no-verify"]

[tasks.semver-checks]
description = "Detect accidental breaking API changes vs the published version"
install_crate = "cargo-semver-checks"
command = "cargo"
args = ["semver-checks", "check-release"]

[tasks.default]
description = "Default: run the test suite"
alias = "test"

[tasks.clippy]
description = "Lint with clippy (all features)"
command = "cargo"
args = ["clippy", "--features", "all", "--all-targets"]

[tasks.deny]
description = "Check licenses, advisories, bans and sources"
command = "cargo"
args = ["deny", "check"]

[tasks.doc]
description = "Build docs for all features"
command = "cargo"
args = ["doc", "--features", "all", "--no-deps"]

# Everything CI should run
[tasks.ci]
description = "Run the full CI pipeline locally"
dependencies = ["fmt", "deny", "test", "clippy", "doc"]
