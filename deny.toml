# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check the full dependency graph, including optional features (sqlite etc.)
all-features = true

[licenses]
version = 2
allow = [
    # Our own license is the dual expression "MIT OR Apache-2.0"
    # (LICENSE-MIT + LICENSE-APACHE) — it resolves through the two entries
    # below; cargo-deny accepts an expression when any clause is allowed.
    # Permissive licenses used by dependencies
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "LGPL-2.1-or-later",
    # Via fjall (xxhash-rust, varint-rs) — both permissive.
    "0BSD",
    "BSL-1.0",
]
confidence-threshold = 0.93

[[licenses.clarify]]
# fuchsia-cprng ships no license field; its source header states BSD-style
# licensing (see its LICENSE in-repo). Pinned explicitly so the gate passes.
name = "fuchsia-cprng"
expression = "BSD-3-Clause"
license-files = []

[advisories]
version = 2
yanked = "warn"
ignore = [
    # crypto-bigint 0.5.5 via starknet-crypto 0.8.1 (constant-time ops may leak via branches).
    # The fix is crypto-bigint >=0.7, which starknet-crypto's ^0.5 requirement does not allow.
    # Remove once starknet-crypto updates its crypto-bigint dependency.
    "RUSTSEC-2026-0387",
    # libsqlite3-sys 0.37 bundles SQLite <3.54 (stale page-cache read with a crafted -wal file).
    # The fix (libsqlite3-sys >=0.39) is unreachable: sqlx-sqlite 0.9.0 caps it at <0.38.0.
    # Only affects processes opening attacker-writable db + wal files; remove once sqlx bumps.
    "RUSTSEC-2026-0459",
    # sled 1.0.0-alpha.124 pulls the whole advisory chain below; every entry
    # enters ONLY through that optional backend feature. All are
    # advisory-level (unmaintained / niche TOCTOU / opt-in uninit API), not
    # reachable exploits in our usage. Revisit when sled ships a stable
    # release that drops the affected transitive deps.
    # tempdir (via sled) — unmaintained, superseded by tempfile.
    "RUSTSEC-2018-0017",
    # file (via sled) — TOCTOU race; we never open attacker-controlled paths.
    "RUSTSEC-2023-0018",
    # bincode 1.x (via sled) — unmaintained; sled pins ^1.0.
    "RUSTSEC-2025-0141",
    # zstd-safe (via sled) — uninitialized-memory footgun in an opt-in API.
    "RUSTSEC-2026-0403",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
